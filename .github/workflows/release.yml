name: Release

# semantic-release en main/master (estable, equivalentes) y qa/develop (prerelease). Si hay version nueva, publica la imagen en ghcr.io.
# El commit de release ("chore(release): ... [skip ci]") actualiza imagen y tag del overlay de Kustomize.
# Funciona sin configurar nada con el GITHUB_TOKEN automatico (permisos declarados abajo). Si las ramas estan
# protegidas contra push del bot, definir el secret opcional RELEASE_TOKEN (token personal con permiso de push).
on:
  push:
    branches: [main, master, qa, develop]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

env:
  HUSKY: '0'
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci?schema=public

jobs:
  release:
    name: Versionar y publicar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      released: ${{ steps.version.outputs.released }}
      tag: ${{ steps.version.outputs.tag }}
      image: ${{ steps.version.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      # semantic-release necesita refs locales de las ramas de release y los tags.
      - name: Preparar ramas y tags
        run: |
          for b in main master qa develop; do
            git fetch origin "$b:$b" --update-head-ok 2>/dev/null || true
          done
          git fetch origin --tags --force

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm prisma generate

      - name: Verificar build antes de liberar
        run: pnpm build

      - name: Tag previo
        id: before
        run: echo "tag=$(git describe --tags --abbrev=0 2>/dev/null || echo none)" >> "$GITHUB_OUTPUT"

      - name: Semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: pnpm exec semantic-release

      - name: Version publicada
        id: version
        run: |
          git fetch origin --tags --force
          AFTER=$(git describe --tags --abbrev=0 2>/dev/null || echo none)
          if [ "$AFTER" != "${{ steps.before.outputs.tag }}" ] && [ "$AFTER" != "none" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
            echo "tag=${AFTER#v}" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "Sin version nueva: no hay commits que liberen desde el ultimo release."
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.version.outputs.released == 'true'

      - uses: docker/login-action@v3
        if: steps.version.outputs.released == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagen
        if: steps.version.outputs.released == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.tag }}
            ${{ steps.version.outputs.image }}:${{ github.ref_name }}-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Despliegue a Kubernetes con Kustomize. Opcional: sin el secret KUBE_CONFIG_B64 (kubeconfig en base64)
  # el job se completa con un aviso y NO falla el pipeline.
  deploy:
    name: Desplegar a Kubernetes (opcional)
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.released == 'true'
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
    steps:
      - name: Verificar credenciales de cluster
        id: gate
        run: |
          if [ -z "$KUBE_CONFIG_B64" ]; then
            echo "Sin KUBE_CONFIG_B64: se omite el despliegue a Kubernetes (el release y la imagen ya quedaron publicados)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      # Rama actualizada: incluye el commit de release con la imagen y el tag del overlay.
      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          ref: ${{ github.ref_name }}

      - name: Aplicar overlay
        if: steps.gate.outputs.enabled == 'true'
        run: |
          case "$GITHUB_REF_NAME" in
            develop) OVERLAY=develop ;;
            qa) OVERLAY=qa ;;
            main | master) OVERLAY=production ;;
          esac
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG_B64" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          NAMESPACE=$(awk '/^namespace:/{print $2}' "ci/k8s/overlays/$OVERLAY/kustomization.yaml")
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -k "ci/k8s/overlays/$OVERLAY"
          kubectl -n "$NAMESPACE" rollout status deployment/node-starter-backend --timeout=180s
