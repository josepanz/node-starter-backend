name: CI

# Funciona sin configurar nada: usa solo el GITHUB_TOKEN automatico. Los tests son unitarios (todo mockeado), sin Postgres ni Redis.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, master, qa, develop]

# Una corrida por rama/PR: una nueva cancela la anterior (excepto en ramas de ambiente).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(fromJSON('["refs/heads/main","refs/heads/master","refs/heads/qa","refs/heads/develop"]'), github.ref) }}

permissions:
  contents: read

env:
  HUSKY: '0'
  # Valor de relleno: prisma validate/generate no se conectan a la base.
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci?schema=public

jobs:
  # lint -> typecheck -> test (cobertura) -> build en un solo job: comparte el install y falla rapido
  # en el primer paso rojo, sin pagar un install por etapa.
  quality:
    name: Lint, typecheck, test y build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Variables de entorno de ejemplo
        run: cp .env.template .env

      - name: Prisma validate y generate
        run: |
          pnpm prisma validate
          pnpm prisma generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm check:types

      - name: Test con cobertura
        run: pnpm test:ci

      - name: Subir reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build
        run: pnpm build

  # E2E con supertest (dependencias mockeadas, sin base). Opcional: no bloquea el pipeline.
  e2e:
    name: E2E (opcional)
    runs-on: ubuntu-latest
    needs: quality
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.template .env
      - run: pnpm prisma generate
      - run: pnpm test:e2e

  # Imagen Docker: en cualquier rama construye sin publicar; en main/master, qa y develop la publica en ghcr.io
  # (registro nativo de GitHub, con el GITHUB_TOKEN). Los PRs, incluidos los de forks, nunca publican.
  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && contains(fromJSON('["refs/heads/main","refs/heads/master","refs/heads/qa","refs/heads/develop"]'), github.ref) }}
    steps:
      - uses: actions/checkout@v4

      # Nombre en minusculas y slug del ref (equivalente a CI_COMMIT_REF_SLUG de GitLab): un tag de
      # Docker no admite "/", y en PRs el ref es "<n>/merge" y en ramas "feat/<nombre>".
      - name: Nombre de imagen y slug del ref
        id: image
        env:
          REF_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          slug="$(echo "${REF_NAME,,}" | sed -E 's/[^a-z0-9._-]+/-/g; s/^[-.]+//; s/-+$//' | cut -c1-63)"
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "slug=${slug:-ref}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login en ghcr.io
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          platforms: linux/amd64
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.slug }}-latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
