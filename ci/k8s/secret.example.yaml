# EJEMPLO con placeholders: NO se incluye en ningun kustomization.yaml y no debe contener valores reales.
# En cada ambiente el Secret `node-starter-backend-secrets` se crea fuera del repo (kubectl, Sealed Secrets,
# External Secrets, vault). Las claves coinciden con .env.template.
#   kubectl -n <namespace> create secret generic node-starter-backend-secrets --from-env-file=<archivo-fuera-del-repo>
apiVersion: v1
kind: Secret
metadata:
  name: node-starter-backend-secrets
type: Opaque
stringData:
  DATABASE_URL: postgresql://USER:PASSWORD@HOST:5432/DB?schema=public
  DATABASE_CONNECTION_STRING: DRIVER={IBM i Access ODBC Driver};UID=USER;PWD=PASSWORD;SYSTEM=HOST;
  JWT_PRIVATE_KEY: '<PEM de la clave privada RSA>'
  JWT_PUBLIC_KEY: '<PEM de la clave publica RSA>'
  ENCRYPTION_ACTIVE_KEY_ID: k1
  ENCRYPTION_KEYS: 'k1:<base64 de 32 bytes>'
  HMAC_SECRET: '<secreto hex>'
  REDIS_URL: redis://HOST:6379/0
  MONGO_URI: mongodb://HOST:27017/DB
  SENTRY_DSN: ''
  EMAIL_PASSWORD: ''
  INFOBIP_API_KEY: ''
  S3_SECRET_ACCESS_KEY: ''
  FIREBASE_PRIVATE_KEY: ''
  VAPID_PRIVATE_KEY: ''
