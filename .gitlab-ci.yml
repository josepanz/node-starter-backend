# Equivalente de .github/workflows (ci.yml + release.yml). Funciona sin configurar nada: usa las variables
# predefinidas de GitLab (CI_REGISTRY, CI_REGISTRY_IMAGE, CI_REGISTRY_USER, CI_REGISTRY_PASSWORD).
# Etapas: lint -> typecheck -> test (cobertura) -> build -> release -> deploy. Los tests son unitarios (todo mockeado).
#
# Opcionales (Settings > CI/CD > Variables, protegidas y enmascaradas):
#   GITLAB_TOKEN       token con scopes api + write_repository. Sin el, el job `release` se SALTA.
#   KUBE_CONFIG_B64    kubeconfig en base64. Sin el, el job `deploy` se SALTA.
#   IMAGE_REPOSITORY, REGISTRY, REGISTRY_USER, REGISTRY_PASSWORD   para usar otro registro distinto al del proyecto.
stages:
  - lint
  - typecheck
  - test
  - build
  - release
  - deploy

workflow:
  rules:
    - if: $CI_COMMIT_MESSAGE =~ /\[skip ci\]/
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

variables:
  HUSKY: '0'
  PNPM_VERSION: '10.18.0'
  # Valor de relleno: prisma validate/generate no se conectan a la base.
  DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/ci?schema=public'
  npm_config_store_dir: '$CI_PROJECT_DIR/.pnpm-store'

default:
  image: node:22.16.0
  interruptible: true
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
  before_script:
    - corepack enable
    - corepack prepare pnpm@${PNPM_VERSION} --activate
    - pnpm install --frozen-lockfile
    - cp .env.template .env
    - pnpm prisma generate

lint:
  stage: lint
  script:
    - pnpm prisma validate
    - pnpm lint

typecheck:
  stage: typecheck
  script:
    - pnpm check:types

test:
  stage: test
  script:
    - pnpm test:ci
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - coverage/

# E2E con supertest (dependencias mockeadas, sin base). Opcional: no bloquea el pipeline.
e2e:
  stage: test
  script:
    - pnpm test:e2e
  allow_failure: true

build:
  stage: build
  script:
    - pnpm build
  artifacts:
    expire_in: 1 day
    paths:
      - dist/

# Imagen Docker: en ramas y MRs construye sin publicar; en main/master, qa y develop publica en el registro del proyecto.
docker-image:
  stage: build
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: '/certs'
  before_script: []
  script:
    - |
      if echo "$CI_COMMIT_BRANCH" | grep -Eq '^(main|master|qa|develop)$' && [ "$CI_PIPELINE_SOURCE" != "merge_request_event" ]; then
        echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
        docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG-latest" -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
        docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG-latest"
        docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
      else
        docker build -t "node-starter-backend:ci" .
      fi

# semantic-release elige @semantic-release/gitlab por GITLAB_CI (ver release.config.cjs) y publica la imagen
# versionada con scripts/deploy.sh (publishCmd). Se salta si no hay GITLAB_TOKEN.
release:
  stage: release
  image: docker:27-cli
  services:
    - docker:27-dind
  interruptible: false
  variables:
    DOCKER_TLS_CERTDIR: '/certs'
    GL_TOKEN: $GITLAB_TOKEN
  before_script:
    - apk add --no-cache nodejs npm git bash
    - npm install -g pnpm@${PNPM_VERSION}
    - pnpm install --frozen-lockfile
    - pnpm prisma generate
  script:
    - pnpm exec semantic-release
  rules:
    - if: $GITLAB_TOKEN == null || $GITLAB_TOKEN == ""
      when: never
    - if: $CI_COMMIT_BRANCH =~ /^(main|master|qa|develop)$/
  resource_group: release-$CI_COMMIT_REF_SLUG

# Despliegue a Kubernetes con Kustomize. Se salta sin KUBE_CONFIG_B64. Aplica el overlay de la rama
# (develop -> develop, qa -> qa, main/master -> production) con la imagen que dejo el commit de release.
deploy:
  stage: deploy
  image:
    name: bitnami/kubectl:1.31
    entrypoint: ['']
  before_script: []
  script:
    - |
      case "$CI_COMMIT_BRANCH" in
        develop) OVERLAY=develop ;;
        qa) OVERLAY=qa ;;
        main | master) OVERLAY=production ;;
      esac
      mkdir -p "$HOME/.kube"
      echo "$KUBE_CONFIG_B64" | base64 -d > "$HOME/.kube/config"
      NAMESPACE=$(awk '/^namespace:/{print $2}' "ci/k8s/overlays/$OVERLAY/kustomization.yaml")
      kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
      kubectl apply -k "ci/k8s/overlays/$OVERLAY"
      kubectl -n "$NAMESPACE" rollout status deployment/node-starter-backend --timeout=180s
  rules:
    - if: $KUBE_CONFIG_B64 == null || $KUBE_CONFIG_B64 == ""
      when: never
    - if: $CI_COMMIT_BRANCH =~ /^(main|master|qa|develop)$/
  resource_group: deploy-$CI_COMMIT_REF_SLUG
